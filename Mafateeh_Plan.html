document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"font-size:13.5px;color:#4B564E\">📚 درسًا في 4 محاور<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:18px 16px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><span data-countup=\"6\" style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:34px;color:#B4863C;display:block;line-height:1.2\">6<\u002Fspan><span style=\"font-size:13.5px;color:#4B564E\">⏳ أسابيع: اختبار ثم طلب ثم إغلاق<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:18px 16px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><span data-countup=\"3\" style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:34px;color:#B4863C;display:block;line-height:1.2\">3<\u002Fspan><span style=\"font-size:13.5px;color:#4B564E\">🪜 خطوات عرض: مجاني، تمهيدي، مدفوع<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:18px 16px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><span style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:34px;color:#B4863C;display:block;line-height:1.2\">3.8M<\u002Fspan><span style=\"font-size:13.5px;color:#4B564E\">🕌 متابع الشيخ الغليظ<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:18px 16px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><span style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:34px;color:#B4863C;display:block;line-height:1.2\">343K<\u002Fspan><span style=\"font-size:13.5px;color:#4B564E\">🎓 متابع أبجديات أونلاين<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:22px;background:linear-gradient(135deg,#3B5943 0%,#28402F 100%);color:#F5F2E8;border-radius:16px;padding:24px 28px;font-size:16px;box-shadow:0 10px 30px rgba(40,64,47,.18)\">🧭 <b style=\"color:#DEC38C\">القرار الاستراتيجي:<\u002Fb> لن نبيع دورة عامة عن التربية؛ سنبيع للأب والأم خريطة عملية تساعدهما على فهم الطفل، حماية بيئته، تعديل سلوكه، واستثمار طاقته — في منهج شرعي منظم يمكن تطبيقه أسبوعيًا.<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"strategy\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">🎯<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Strategic Core<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px)\">الاستراتيجية التي سنبني عليها كل قرار 🧠<\u002Fh2>\n  <p style=\"color:#4B564E;max-width:720px;margin-bottom:28px;font-size:16.5px;text-wrap:pretty\">الخطة لا تبدأ من المنصات، بل من الشخص الذي نريد مساعدته، والمشكلة التي يشعر بها، والنتيجة التي يستطيع أن يلمسها بعد التسجيل.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><div style=\"display:inline-block;font-size:12.5px;background:#EFEADA;color:#28402F;padding:4px 12px;border-radius:20px;margin-bottom:10px\">🧭 التموضع<\u002Fdiv><h3 style=\"font-size:20px;margin-bottom:10px\">منهج شرعي يتحول إلى سلوك يومي 🕌<\u002Fh3><p style=\"font-size:16px;color:#4B564E;margin:0\">«مفاتيح» ليست محتوى وعظيًا متفرقًا ولا وصفة سلوكية مستوردة؛ إنها برنامج مرتب يربط المعنى الشرعي بالموقف اليومي، ويعطي الوالد خطوة قابلة للتجربة بدل نصيحة عامة.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><div style=\"display:inline-block;font-size:12.5px;background:#EFEADA;color:#28402F;padding:4px 12px;border-radius:20px;margin-bottom:10px\">🤝 الوعد التسويقي<\u002Fdiv><h3 style=\"font-size:20px;margin-bottom:10px\">افهم قبل أن تعاقب، وطبّق قبل أن تحكم 💚<\u002Fh3><p style=\"font-size:16px;color:#4B564E;margin:0\">الوعد ليس أن يصبح الطفل مثاليًا، بل أن يمتلك الوالد إطارًا أوضح لفهم احتياجاته، وتقليل ردود الفعل المرتجلة، وبناء عادات تربوية ثابتة.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"overflow-x:auto;margin-top:18px\"><sc-raw-table>\n    <sc-raw-tr><sc-raw-th>👨‍👩‍👦 الشريحة<\u002Fsc-raw-th><sc-raw-th>💭 ماذا تقول لنفسها؟<\u002Fsc-raw-th><sc-raw-th>🗣️ زاوية الرسالة<\u002Fsc-raw-th><sc-raw-th>👉 الدعوة المناسبة<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>الأم أو الأب المرهق 😮‍💨<\u002Fsc-raw-td><sc-raw-td>«أنا بكرر نفس الكلام ومفيش تغيير»<\u002Fsc-raw-td><sc-raw-td>بدل رد الفعل، افهم أصل السلوك وخد خطوة واحدة<\u002Fsc-raw-td><sc-raw-td>الدليل المجاني<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>الوالد الحريص على المنهج 📖<\u002Fsc-raw-td><sc-raw-td>«عايز تربية عملية من مرجعية موثوقة»<\u002Fsc-raw-td><sc-raw-td>تأصيل شرعي مرتب مع تطبيق أسبوعي<\u002Fsc-raw-td><sc-raw-td>الندوة أو الدرس التمهيدي<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>أسرة لديها ولد وبنت 👦👧<\u002Fsc-raw-td><sc-raw-td>«مش كل طفل ينفع معاه نفس الأسلوب»<\u002Fsc-raw-td><sc-raw-td>فهم الفروق الفردية والاحتياجات دون تنميط أو تعميم<\u002Fsc-raw-td><sc-raw-td>صفحة الدورة<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>العائلة خارج مصر 🌍<\u002Fsc-raw-td><sc-raw-td>«أحتاج محتوى عربيًا مناسبًا لبيتي»<\u002Fsc-raw-td><sc-raw-td>نفس المنهج مع دفع وسعر ورسالة مناسبة للسوق<\u002Fsc-raw-td><sc-raw-td>صفحة دفع دولية<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-table><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:18px\">\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><div style=\"display:inline-block;font-size:12.5px;background:#EFEADA;color:#28402F;padding:4px 12px;border-radius:20px;margin-bottom:10px\">🎁 عرض 1 · مجاني<\u002Fdiv><h3 style=\"font-size:20px;margin-bottom:10px\">دليل «قبل ما ترد»<\u002Fh3><p style=\"font-size:15.5px;color:#4B564E;margin:0\">ملف قصير أو اختبار تفاعلي يجمع الإذن بالتواصل ويكشف مشكلة الوالد الأساسية.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><div style=\"display:inline-block;font-size:12.5px;background:#EFEADA;color:#28402F;padding:4px 12px;border-radius:20px;margin-bottom:10px\">🔥 عرض 2 · تمهيدي<\u002Fdiv><h3 style=\"font-size:20px;margin-bottom:10px\">تحدي 5 أيام<\u002Fh3><p style=\"font-size:15.5px;color:#4B564E;margin:0\">رسالة أو تطبيق يومي قصير يبرهن على أسلوب الدورة ويهيئ قرار الشراء.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><div style=\"display:inline-block;font-size:12.5px;background:#EFEADA;color:#28402F;padding:4px 12px;border-radius:20px;margin-bottom:10px\">💳 عرض 3 · مدفوع<\u002Fdiv><h3 style=\"font-size:20px;margin-bottom:10px\">دورة مفاتيح<\u002Fh3><p style=\"font-size:15.5px;color:#4B564E;margin:0\">14 درسًا، 4 محاور، واجبات تطبيق، متابعة، ومجتمع أسئلة؛ هذه هي قيمة العرض وليست عدد الدروس فقط.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:14.5px;color:#A85D4C;background:#F7EAE6;border:1px solid #EBD1CA;padding:14px 18px;border-radius:12px;margin-top:16px\">⚠️ <b>قواعد الرسالة:<\u002Fb> لا تخويف، لا تشخيص للطفل من مقطع، لا وعود من نوع «غيّر ابنك في أيام»، ولا استخدام للولد والبنت كقالبين ثابتين. كل مادة تمر على المراجعة الشرعية والتحريرية قبل النشر.<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pillars\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">🌳<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Course Pillars<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px)\">المحاور الأربعة — أساس كل قطعة محتوى 🧱<\u002Fh2>\n  <p style=\"color:#4B564E;max-width:760px;margin-bottom:28px;font-size:16.5px;text-wrap:pretty\">أي فكرة أو ريل أو إعلان لازم يرجع لواحد من المحاور دي. مفيش محتوى \"عام عن التربية\" من غير ما يكون جزء من المنهج الفعلي. 👇 التفاصيل الكاملة لكل محاضرة (هوكس، اقتباسات، قصص، أفكار محتوى) في <a href=\"#bank\" style=\"color:#3B5943;text-decoration:underline\">بنك المحتوى<\u002Fa> تحت.<\u002Fp>\n\n  <div style=\"display:flex;justify-content:center;margin:30px 0 10px\">\n    <svg sc-camel-view-box=\"0 0 440 440\" style=\"width:100%;max-width:520px;height:auto\">\n      <circle cx=\"220\" cy=\"220\" r=\"180\" fill=\"none\" stroke=\"#DBD4BF\" stroke-width=\"1\"><\u002Fcircle>\n      <circle cx=\"220\" cy=\"220\" r=\"140\" fill=\"none\" stroke=\"#DBD4BF\" stroke-width=\"1\"><\u002Fcircle>\n      <circle cx=\"220\" cy=\"220\" r=\"100\" fill=\"none\" stroke=\"#DBD4BF\" stroke-width=\"1\"><\u002Fcircle>\n      <path d=\"M220,40 A180,180 0 0 1 400,220\" fill=\"none\" stroke=\"#3B5943\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-dasharray=\"900\" style=\"animation:drawIn 1.6s .1s ease both\"><\u002Fpath>\n      <path d=\"M400,220 A180,180 0 0 1 220,400\" fill=\"none\" stroke=\"#B4863C\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-dasharray=\"900\" style=\"animation:drawIn 1.6s .3s ease both\"><\u002Fpath>\n      <path d=\"M220,400 A180,180 0 0 1 40,220\" fill=\"none\" stroke=\"#A85D4C\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-dasharray=\"900\" style=\"animation:drawIn 1.6s .5s ease both\"><\u002Fpath>\n      <path d=\"M40,220 A180,180 0 0 1 220,40\" fill=\"none\" stroke=\"#7C8F55\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-dasharray=\"900\" style=\"animation:drawIn 1.6s .7s ease both\"><\u002Fpath>\n      <text x=\"220\" y=\"212\" text-anchor=\"middle\" style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:21px;fill:#28402F\">مفاتيح<\u002Ftext>\n      <text x=\"220\" y=\"238\" text-anchor=\"middle\" style=\"font-family:'Tajawal',sans-serif;font-size:13px;fill:#232E28\">تربية الأبناء<\u002Ftext>\n      <text x=\"310\" y=\"95\" text-anchor=\"middle\" style=\"font-family:'Tajawal',sans-serif;font-size:13px;fill:#232E28\">التأسيس<\u002Ftext>\n      <text x=\"352\" y=\"330\" text-anchor=\"middle\" style=\"font-family:'Tajawal',sans-serif;font-size:13px;fill:#232E28\">الحماية<\u002Ftext>\n      <text x=\"130\" y=\"360\" text-anchor=\"middle\" style=\"font-family:'Tajawal',sans-serif;font-size:13px;fill:#232E28\">السلوك والطباع<\u002Ftext>\n      <text x=\"95\" y=\"95\" text-anchor=\"middle\" style=\"font-family:'Tajawal',sans-serif;font-size:13px;fill:#232E28\">الطاقات والمهارات<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-top:4px solid #3B5943;border-radius:16px;padding:22px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><div style=\"display:inline-block;font-size:12.5px;background:#EFEADA;color:#28402F;padding:4px 12px;border-radius:20px;margin-bottom:10px\">المحور 1<\u002Fdiv><h3 style=\"font-size:19px;margin-bottom:10px\">🏛️ التأسيس والمسؤولية<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>مقدمة هامة في التربية<\u002Fli><li>تربية الولد أمانة<\u002Fli><li>أهم 4 مهام في التربية<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-top:4px solid #B4863C;border-radius:16px;padding:22px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><div style=\"display:inline-block;font-size:12.5px;background:#EFEADA;color:#28402F;padding:4px 12px;border-radius:20px;margin-bottom:10px\">المحور 2<\u002Fdiv><h3 style=\"font-size:19px;margin-bottom:10px\">🛡️ الحماية من المشتتات<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>3 حاجات لازم تحمي ابنك منهم<\u002Fli><li>الترف وأثره السيء<\u002Fli><li>لباس الأولاد والموضة<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-top:4px solid #A85D4C;border-radius:16px;padding:22px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><div style=\"display:inline-block;font-size:12.5px;background:#EFEADA;color:#28402F;padding:4px 12px;border-radius:20px;margin-bottom:10px\">المحور 3<\u002Fdiv><h3 style=\"font-size:19px;margin-bottom:10px\">🌱 السلوك والطباع والتزكية<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>علامات نجابة الولد والتزكية<\u002Fli><li>تعزيز وتعديل السلوك<\u002Fli><li>حفظ طباع الأولاد<\u002Fli><li>طاعة الوالدين<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-top:4px solid #7C8F55;border-radius:16px;padding:22px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><div style=\"display:inline-block;font-size:12.5px;background:#EFEADA;color:#28402F;padding:4px 12px;border-radius:20px;margin-bottom:10px\">المحور 4<\u002Fdiv><h3 style=\"font-size:19px;margin-bottom:10px\">⚡ الطاقات والمهارات<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>فيمَ أشغل ابني؟<\u002Fli><li>أهمية الرياضة للأولاد<\u002Fli><li>آداب الأولاد في المجالس<\u002Fli><li>أهم ما تربي عليه ابنتك<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height:26px\"><\u002Fdiv>\n\n  <div style=\"background:linear-gradient(135deg,#C99A4B 0%,#B4863C 100%);color:#2b2109;border-radius:16px;padding:24px 28px;font-size:16px;box-shadow:0 10px 30px rgba(180,134,60,.22)\">\n    🌟 <b style=\"color:#fff\">صفحة الشيخ أصل توزيع ثمين، وليست ضمانًا للتحويل.<\u002Fb> نستخدمها باختبارات موثقة: 3 منشورات تمهيدية، رابط وUTM مختلف لكل منشور، وكلمة مفتاحية واحدة للقياس. لا نبني التوقعات على عدد المتابعين؛ نبنيها على الوصول الفعلي، جودة المهتمين، والتسجيلات المنسوبة فعليًا.\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:18px\">\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">📌 Pin أول على صفحة الشيخ<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>بوست ثابت: \"أهم حاجة هعملها للأهل السنادي\"<\u002Fli><li>فيديو شخصي 60 ث بدون ديكور<\u002Fli><li>دعوة لكتابة \"مفاتيح\" في التعليق<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🎥 سلسلة \"وصية صغيرة\"<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>الشيخ يسجل 60 ثانية بعد الفجر أو بين المحاضرات<\u002Fli><li>وصية نبوية واحدة + تطبيق عملي<\u002Fli><li>3 مرات أسبوعيًا من صفحته الشخصية<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🔴 لايف أسبوعي من صفحة الشيخ<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>10 دقايق درس مصغر من محور واحد<\u002Fli><li>ختام اللايف بدعوة هادئة للمتابعة<\u002Fli><li>الـ3.8M بياخدوا إشعار تلقائي<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"bank\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">🗂️<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Full Content Bank<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px)\">بنك المحتوى الكامل — كل محاضرة بمادتها الخام 💎<\u002Fh2>\n  <p style=\"color:#4B564E;max-width:760px;margin-bottom:22px;font-size:16.5px;text-wrap:pretty\">كل المحاضرات اللي اتحللت لحد دلوقتي، بهوكسها واقتباساتها وقصص السيرة وأفكار المحتوى الجاهزة — مصنفة حسب المحور ومرحلة التسويق (غير مباشر/مباشر). اضغطي على أي محاضرة لفتح التفاصيل كاملة.<\u002Fp>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px\">\n    <div style=\"display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #DBD4BF;border-radius:24px;padding:8px 16px;flex:1;min-width:240px\">\n      <span style=\"font-size:17px\">🔎<\u002Fspan>\n      <input value=\"{{ search }}\" sc-camel-on-input=\"{{ onSearch }}\" placeholder=\"دوّري على هوك، اقتباس، أو فكرة محتوى...\" style=\"border:none;outline:none;background:transparent;font-size:15.5px;width:100%;color:#232E28\">\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ openAllLec }}\" style=\"border:1px solid #DBD4BF;background:#fff;padding:10px 18px;border-radius:24px;font-size:15px;cursor:pointer;color:#28402F;transition:.2s\" style-hover=\"background:#EFF3EA;transform:translateY(-2px)\">📂 افتح الكل<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ closeAllLec }}\" style=\"border:1px solid #DBD4BF;background:#fff;padding:10px 18px;border-radius:24px;font-size:15px;cursor:pointer;color:#28402F;transition:.2s\" style-hover=\"background:#EFF3EA;transform:translateY(-2px)\">📁 اقفل الكل<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px\">\n    <sc-for list=\"{{ lecFilters }}\" as=\"f\" hint-placeholder-count=\"7\">\n      <button sc-camel-on-click=\"{{ f.onPick }}\" style=\"border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};padding:9px 18px;border-radius:22px;font-size:15px;cursor:pointer;transition:.2s\" style-hover=\"transform:translateY(-2px)\">{{ f.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n    <span style=\"align-self:center;font-size:14.5px;color:#4B564E\">📊 {{ lecCount }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ lectures }}\" as=\"lec\" hint-placeholder-count=\"4\">\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-inline-start:6px solid {{ lec.accent }};border-radius:16px;box-shadow:0 2px 18px rgba(35,46,40,.07);margin-bottom:14px;overflow:hidden;transition:box-shadow .3s\" style-hover=\"box-shadow:0 12px 30px rgba(35,46,40,.12)\">\n      <div sc-camel-on-click=\"{{ lec.onToggle }}\" style=\"display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;flex-wrap:wrap;background:{{ lec.headBg }};transition:background .25s\">\n        <span style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:20px;color:#B4863C;min-width:36px\">{{ lec.num }}<\u002Fspan>\n        <h4 style=\"margin:0;font-size:17px;font-family:'Cairo',sans-serif;font-weight:700;color:#28402F\">{{ lec.emoji }} {{ lec.title }}<\u002Fh4>\n        <span style=\"font-size:12.5px;padding:4px 12px;border-radius:20px;background:{{ lec.phaseBg }};color:{{ lec.phaseColor }};margin-inline-start:auto;white-space:nowrap\">{{ lec.phaseText }}<\u002Fspan>\n        <span style=\"font-size:14px;color:#4B564E\">{{ lec.arrow }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ lec.open }}\">\n        <div style=\"padding:6px 20px 22px;animation:popIn .35s ease both\">\n          <p style=\"font-size:16px;color:#4B564E\">{{ lec.bigIdea }}<\u002Fp>\n          <div style=\"margin:16px 0 8px;font-size:14.5px;font-weight:700;color:#28402F;font-family:'Cairo',sans-serif\">🪝 الهوكس<\u002Fdiv>\n          <sc-for list=\"{{ lec.hooks }}\" as=\"h\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start;background:#F7F4EC;border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:15.5px;transition:background .2s\" style-hover=\"background:#EFF3EA\">\n              <span style=\"flex:1\">«{{ h.text }}»<\u002Fspan>\n              <button sc-camel-on-click=\"{{ h.onCopy }}\" style=\"border:none;background:transparent;cursor:pointer;font-size:16px;padding:0 2px;transition:transform .2s\" style-hover=\"transform:scale(1.25)\">📋<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"margin:16px 0 8px;font-size:14.5px;font-weight:700;color:#28402F;font-family:'Cairo',sans-serif\">💬 اقتباسات وأحاديث<\u002Fdiv>\n          <sc-for list=\"{{ lec.quotes }}\" as=\"q\" hint-placeholder-count=\"3\">\n            <div style=\"background:#EFEADA;border-radius:12px;padding:12px 16px;margin-bottom:8px;font-size:15.5px\">«{{ q.t }}»<span style=\"display:block;font-size:12.5px;color:#B4863C;margin-top:4px\">— {{ q.s }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ lec.hasSituations }}\">\n            <div style=\"margin:16px 0 8px;font-size:14.5px;font-weight:700;color:#28402F;font-family:'Cairo',sans-serif\">🧩 مواقف من المحاضرة<\u002Fdiv>\n            <ul style=\"font-size:15.5px;color:#4B564E\"><sc-for list=\"{{ lec.situations }}\" as=\"s\" hint-placeholder-count=\"2\"><li>{{ s.text }}<\u002Fli><\u002Fsc-for><\u002Ful>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ lec.hasStories }}\">\n            <div style=\"margin:16px 0 8px;font-size:14.5px;font-weight:700;color:#28402F;font-family:'Cairo',sans-serif\">📜 إسقاطات من السيرة<\u002Fdiv>\n            <ul style=\"font-size:15.5px;color:#4B564E\"><sc-for list=\"{{ lec.stories }}\" as=\"s\" hint-placeholder-count=\"2\"><li>{{ s.text }}<\u002Fli><\u002Fsc-for><\u002Ful>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ lec.hasReady }}\">\n            <div style=\"margin:16px 0 8px;font-size:14.5px;font-weight:700;color:#28402F;font-family:'Cairo',sans-serif\">✍️ نصوص بوستات جاهزة<\u002Fdiv>\n            <sc-for list=\"{{ lec.readyCopy }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"background:#FFF9EE;border:1p  style-hover=\"transform:translateY(-4px)\"><b style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:24px;color:#DEC38C;display:block\">{{ rBudget }}<\u002Fb><span style=\"font-size:13px;opacity:.88\">💰 ميزانية اختبارية مقترحة (جنيه)<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#28402F;color:#F5F2E8;border-radius:12px;padding:18px;text-align:center;transition:transform .3s\" style-hover=\"transform:translateY(-4px)\"><b style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:24px;color:#DEC38C;display:block\">{{ rRevenue }}<\u002Fb><span style=\"font-size:13px;opacity:.88\">📈 الإيراد المتوقع (جنيه)<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#28402F;color:#F5F2E8;border-radius:12px;padding:18px;text-align:center;transition:transform .3s\" style-hover=\"transform:translateY(-4px)\"><b style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:24px;color:#DEC38C;display:block\">{{ rCAC }}<\u002Fb><span style=\"font-size:13px;opacity:.88\">🎯 تكلفة التسجيل المختلطة (CAC)<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#28402F;color:#F5F2E8;border-radius:12px;padding:18px;text-align:center;transition:transform .3s\" style-hover=\"transform:translateY(-4px)\"><b style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:24px;color:#DEC38C;display:block\">{{ rROAS }}<\u002Fb><span style=\"font-size:13px;opacity:.88\">🚀 ROAS تقريبي<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:14.5px;color:#A85D4C;background:#F7EAE6;border:1px solid #EBD1CA;padding:14px 18px;border-radius:12px;margin-top:18px\">⚠️ الأرقام تقديرية للتخطيط فقط، وليست وعدًا بالنتيجة. بعد أول 72 ساعة نحدّثها بالـCPL الحقيقي، ثم بعد أول تسجيلات ننتقل من تخطيط الـLeads إلى تخطيط تكلفة التسجيل المدفوع فعليًا.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"readiness\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10 letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Strategic Gaps<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px);margin-bottom:26px\">الفجوات الاستراتيجية وحلولها 🔧<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px\">\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">📡 1. فجوة الوصول<\u002Fh3><p style=\"font-size:16px;color:#4B564E\">343K متابع الأكاديمية وحدها مش كفاية للوصول لهدف تسجيلات كبير.<\u002Fp><p style=\"font-size:16px\">✅ <b>الحل:<\u002Fb> تفعيل صفحة الشيخ 3.8M رسميًا في الحملة، بدل الاعتماد على الأكاديمية بس.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🗃️ 2. فجوة قاعدة البيانات<\u002Fh3><p style=\"font-size:16px;color:#4B564E\">مفيش قاعدة عملاء سابقين لهذه الدورة بالذات، فكل حملة بتبدأ من الصفر.<\u002Fp><p style=\"font-size:16px\">✅ <b>الحل:<\u002Fb> دليل تمهيدي (Lead Magnet) في الأسبوعين الأولين يبني قائمة قبل فتح باب التسجيل.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🧭 3. فجوة المحتوى المنهجي<\u002Fh3><p style=\"font-size:16px;color:#4B564E\">محتوى عشوائي بلا ربط بمراحل رحلة الأب/الأم من الوعي للقرار.<\u002Fp><p style=\"font-size:16px\">✅ <b>الحل:<\u002Fb> Content Calendar بإطار AIDA — كل أسبوع له هدف واحد واضح.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🛰️ 4. فجوة التتبع التقني<\u002Fh3><p style=\"font-size:16px;color:#4B564E\">بلا Pixel وCAPI وUTM، مفيش طريقة نعرف أي إعلان فعلًا بيجيب تسجيلات.<\u002Fp><p style=\"font-size:16px\">✅ <b>الحل:<\u002Fb> تفعيل التتبع الكامل قبل أول جنيه إعلانات، مش بعده.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🤍 5. فجوة الاحتفاظ<\u002Fh3><p style=\"font-size:16px;color:#4B564E\">الطالب اللي يسجل ويسيب الدورة نص الطريق = خسارة سمعة مش بس مبيعات.<\u002Fp><p style=\"font-size:16px\">✅ <b>الحل:<\u002Fb> متابعة غياب أسبوعية + رسالة شخصية بعد أي انقطاع.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🏠 6. فجوة التطبيق العملي<\u002Fh3><p style=\"font-size:16px;color:#4B564E\">معرفة نظرية بلا واجبات يومية = بلا تغيير حقيقي في البيت.<\u002Fp><p style=\"font-size:16px\">✅ <b>الميزة التنافسية:<\u002Fb> اجعلي \"التطبيق العملي أسبوعيًا\" نقطة البيع الأولى في كل رسالة.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"ideas\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">💡<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Growth Ideas<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px);margin-bottom:26px\">أفكار إضافية لزيادة الوصول والتحويل ✨<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px\">\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🎁 نظام إحالة من اليوم الأول<\u002Fh3><p style=\"font-size:15.5px;color:#4B564E;margin:0\">كل مشترك يحصل على كود خاص، وكل تسجيل من كوده = خصم أو محتوى بونص له. تفعيل نظام أبجديات بوينتس الموجود بالفعل.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">📢 قناة واتساب للإعلانات<\u002Fh3><p style=\"font-size:15.5px;color:#4B564E;margin:0\">مكان واحد يلجأ له الجمهور لمتابعة كل جديد عن الدورة والعروض، بدل التشتت بين القنوات.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🤝 شراكة مع مؤثرين تربويين<\u002Fh3><p style=\"font-size:15.5px;color:#4B564E;margin:0\">3-5 صفحات أبوة/أمومة بمتابعين متوسطين، مقابل عمولة من كل تسجيل عبر رابطهم — بلا تكلفة مقدّمة.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">📸 بوست Social Proof<\u002Fh3><p style=\"font-size:15.5px;color:#4B564E;margin:0\">سكرين شوت حقيقي من آراء أهالي حضروا محاضرات سابقة للشيخ، بإذنهم — الناس بتصدّق بعضها أكتر من الإعلان.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">👨‍👩‍👧‍👦 كوميونيتي أولياء الأمور<\u002Fh3><p style=\"font-size:15.5px;color:#4B564E;margin:0\">جروب فيسبوك للأهالي المهتمين، حتى قبل التسجيل — مساحة نقاش تبني انتماء قبل البيع.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">🌍 حملة للجمهور خارج مصر<\u002Fh3><p style=\"font-size:15.5px;color:#4B564E;margin:0\">نفس المحتوى، استهداف واستراتيجية تسعير مختلفة للخليج والمهجر.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"calendar\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">📅<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">AIDA Content Calendar<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px);margin-bottom:26px\">خريطة الأسابيع الستة — مراحل القرار 🗺️<\u002Fh2>\n  <div style=\"overflow-x:auto\"><sc-raw-table>\n    <sc-raw-tr><sc-raw-th>الأسبوع<\u002Fsc-raw-th><sc-raw-th>مرحلة القرار<\u002Fsc-raw-th><sc-raw-th>المخرجات الأساسية<\u002Fsc-raw-th><sc-raw-th>بوابة الانتقال<\u002Fsc-raw-th><sc-raw-th>قرار الإدارة<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>1️⃣<\u002Fsc-raw-td><sc-raw-td>اختبار الرسالة<\u002Fsc-raw-td><sc-raw-td>3 زوايا ألم + 6 ريلز + دليل مجاني + تجهيز القياس<\u002Fsc-raw-td><sc-raw-td>أعلى حفظ ومشاهدة مؤهلة<\u002Fsc-raw-td><sc-raw-td>نثبت زاويتين فقط<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>2️⃣<\u002Fsc-raw-td><sc-raw-td>بناء الطلب<\u002Fsc-raw-td><sc-raw-td>تحدي 5 أيام + لايف + تجميع Leads من الشيخ والأكاديمية<\u002Fsc-raw-td><sc-raw-td>جودة الـLead والرد<\u002Fsc-raw-td><sc-raw-td>نوسع الجمهور الفائز<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>3️⃣<\u002Fsc-raw-td><sc-raw-td>تقديم العرض<\u002Fsc-raw-td><sc-raw-td>صفحة البيع + درس عينة + تفاصيل المنهج + فتح التسجيل<\u002Fsc-raw-td><sc-raw-td>زيارة الصفحة وإضافة الدفع<\u002Fsc-raw-td><sc-raw-td>نعالج أكبر اعتراضين<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>4️⃣<\u002Fsc-raw-td><sc-raw-td>إثبات القيمة<\u002Fsc-raw-td><sc-raw-td>شهادات موثقة + FAQ + بث أسئلة + متابعة شخصية<\u002Fsc-raw-td><sc-raw-td>بدء الدفع من الـLeads<\u002Fsc-raw-td><sc-raw-td>نزيد على الكرياتيف الرابح<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>5️⃣<\u002Fsc-raw-td><sc-raw-td>الإغلاق الذكي<\u002Fsc-raw-td><sc-raw-td>عرض محدد بموعد واضح + إعادة استهداف + تذكير للقوائم<\u002Fsc-raw-td><sc-raw-td>تحسن التسجيل اليومي<\u002Fsc-raw-td><sc-raw-td>نوقف ما لا يحقق مبيعات<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>6️⃣<\u002Fsc-raw-td><sc-raw-td>آخر دعوة ثم تفعيل<\u002Fsc-raw-td><sc-raw-td>إغلاق التسجيل أو تغيير العرض بوضوح + رسائل ترحيب وبدء<\u002Fsc-raw-td><sc-raw-td>دفع مكتمل وبدء الدورة<\u002Fsc-raw-td><sc-raw-td>نحوّل التجربة إلى إحالات<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-table><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:24px\">\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07)\"><h3 style=\"font-size:19px;margin-bottom:12px\">🧁 Content Mix Formula<\u002Fh3>\n      <div style=\"overflow-x:auto\"><sc-raw-table>\n        <sc-raw-tr><sc-raw-th>النوع<\u002Fsc-raw-th><sc-raw-th>النسبة<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>🎬 ريلز / فيديو<\u002Fsc-raw-td><sc-raw-td>40%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>📸 كاروسيل / صورة<\u002Fsc-raw-td><sc-raw-td>25%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>🔴 لايف / بث أسئلة<\u002Fsc-raw-td><sc-raw-td>15%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>📝 بوست نصي / تأملي<\u002Fsc-raw-td><sc-raw-td>10%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>📖 ستوري يومية<\u002Fsc-raw-td><sc-raw-td>10%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-table><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07)\"><h3 style=\"font-size:19px;margin-bottom:10px\">♻️ قاعدة الـ3 في 1<\u002Fh3><p style=\"font-size:16px;color:#4B564E;margin:0\">كل لايف أو مقطع تصوير من الشيخ = 3 ريلز (30–45 ث) + يوتيوب Short + تيك توك. يوم تصوير واحد = 5 قطع محتوى جاهزة للنشر على مدار الأسبوع.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"sops\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">⚙️<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Operating Procedures<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px);margin-bottom:26px\">الإجراءات التشغيلية 🧰<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px\">\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s,box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">💬 SOP-01: إدارة التعليقات والرسائل<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>رد صباحي 9ص + مسائي 6م على كل تعليق ورسالة<\u002Fli><li>أي سؤال عن السعر = Lead فوري يتنقل لخدمة العملاء<\u002Fli><li>ممنوع أي رد دفاعي على تعليق سلبي<\u002Fli><li>رد خلال 4 ساعات كحد أقصى<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s,box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">⏱️ SOP-02: متابعة المهتمين (Leads)<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>قاعدة الـ30 دقيقة: رد شخصي على أي مهتم خلال نص ساعة<\u002Fli><li>لو ما ردّش بعد 24 ساعة: رسالة متابعة لطيفة<\u002Fli><li>لو ما ردّش بعد 3 أيام: رسالة أخيرة بلا إلحاح<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07)\"><h3 style=\"font-size:19px;margin-bottom:12px\">📣 SOP-03: الإعلانات المدفوعة<\u002Fh3>\n      <div style=\"overflow-x:auto\"><sc-raw-table>\n        <sc-raw-tr><sc-raw-th>المؤشر<\u002Fsc-raw-th><sc-raw-th>القرار<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>قبل اكتمال 1,000–2,000 ظهور<\u002Fsc-raw-td><sc-raw-td>لا نقتل الإعلان مبكرًا؛ نراقب المشاهدة والنقر فقط<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>CPL أعلى من الهدف بـ30%<\u002Fsc-raw-td><sc-raw-td>نختبر Hook أو جمهورًا أو صفحة؛ لا نزيد الميزانية<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Leads جيدة بلا دفع<\u002Fsc-raw-td><sc-raw-td>نراجع العرض، الثقة، الأسئلة الشائعة، وسرعة المتابعة<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>تسجيلات بتكلفة مقبولة<\u002Fsc-raw-td><sc-raw-td>نرفع الميزانية تدريجيًا مع مراقبة الجودة والإكمال<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-table><\u002Fdiv>\n      <p style=\"font-size:14.5px;color:#4B564E;margin:12px 0 0\">🧮 <b>معادلة الهدف:<\u002Fb> أقصى CPL = أقصى CAC المقبول × معدل التحويل من Lead إلى تسجيل.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:16px;padding:24px;box-shadow:0 2px 18px rgba(35,46,40,.07);transition:transform .35s,box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 34px rgba(35,46,40,.13)\"><h3 style=\"font-size:19px;margin-bottom:10px\">📋 SOP-04: التقرير الأسبوعي — كل أحد<\u002Fh3><ul style=\"font-size:15.5px;color:#4B564E\"><li>الوصول والتفاعل مقارنة بالأسبوع السابق<\u002Fli><li>عدد المهتمين الجدد وعدد التسجيلات<\u002Fli><li>متوسط CPL وأفضل قطعة محتوى أداءً<\u002Fli><li>3 قرارات فقط للأسبوع القادم<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"team\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">👥<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Team &amp; Ownership<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px);margin-bottom:26px\">الفريق والمسؤوليات لكل قناة 🤝<\u002Fh2>\n  <div style=\"overflow-x:auto\"><sc-raw-table>\n    <sc-raw-tr><sc-raw-th>القناة<\u002Fsc-raw-th><sc-raw-th>المسؤول<\u002Fsc-raw-th><sc-raw-th>المرجع عند التصعيد<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>📘 فيسبوك/انستجرام (مدفوع)<\u002Fsc-raw-td><sc-raw-td>مسؤول الإعلانات<\u002Fsc-raw-td><sc-raw-td>الميسّر (أبو عبود)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>📸 انستجرام/تيك توك (عضوي)<\u002Fsc-raw-td><sc-raw-td>مسؤول المحتوى<\u002Fsc-raw-td><sc-raw-td>مسؤولة المحتوى<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>▶️ يوتيوب<\u002Fsc-raw-td><sc-raw-td>مسؤول الفيديو الطويل<\u002Fsc-raw-td><sc-raw-td>مسؤول التصميم والفيديو<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>✈️ تليجرام<\u002Fsc-raw-td><sc-raw-td>مسؤول الأتمتة/المجتمع<\u002Fsc-raw-td><sc-raw-td>مسؤولة التقني<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>💬 واتساب<\u002Fsc-raw-td><sc-raw-td>مسؤول خدمة العملاء<\u002Fsc-raw-td><sc-raw-td>الميسّر<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>⚖️ المراجعة الشرعية<\u002Fsc-raw-td><sc-raw-td>الشيخ الغليظ/مختص محدد<\u002Fsc-raw-td><sc-raw-td>مسؤول المحتوى<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-table><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"kpi\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">📊<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Control Dashboard<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px);margin-bottom:26px\">لوحة القياس والتحكم — حسب القناة 🎛️<\u002Fh2>\n  <div style=\"overflow-x:auto\"><sc-raw-table>\n    <sc-raw-tr><sc-raw-th>القناة<\u002Fsc-raw-th><sc-raw-th>مؤشر التمهيد<\u002Fsc-raw-th><sc-raw-th>مؤشر البيع<\u002Fsc-raw-th><sc-raw-th>قرار عند الضعف<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>📘 فيسبوك/انستجرام<\u002Fsc-raw-td><sc-raw-td>CTR، تكلفة التفاعل<\u002Fsc-raw-td><sc-raw-td>CPL، CPA، ROAS<\u002Fsc-raw-td><sc-raw-td>تغيير الإعلان/الجمهور قبل زيادة الميزانية<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>🎵 تيك توك<\u002Fsc-raw-td><sc-raw-td>معدل المشاهدة الكامل، المشاركات<\u002Fsc-raw-td><sc-raw-td>الزيارات لصفحة التسجيل<\u002Fsc-raw-td><sc-raw-td>تغيير أول 3 ثواني من الريل<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>▶️ يوتيوب<\u002Fsc-raw-td><sc-raw-td>مدة المشاهدة، البحث العضوي<\u002Fsc-raw-td><sc-raw-td>نقرات الرابط في الوصف<\u002Fsc-raw-td><sc-raw-td>تعديل العنوان والصورة المصغرة<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>✈️ تليجرام<\u002Fsc-raw-td><sc-raw-td>نمو القناة، نسبة القراءة<\u002Fsc-raw-td><sc-raw-td>الرد على رابط التسجيل<\u002Fsc-raw-td><sc-raw-td>تغيير التوقيت أو نوع الرسالة<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>💬 واتساب<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>معدل الرد والتحويل من الرسائل<\u002Fsc-raw-td><sc-raw-td>مراجعة صياغة الرسائل مع مسؤول خدمة العملاء<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-table><\u002Fdiv>\n  <p style=\"margin-top:16px;color:#4B564E;font-size:16.5px\">⏰ اجتماع مراجعة قصير كل 3 أيام أثناء شهر البيع — قرارات التعديل لازم تطلع بسرعة، مش بعد أسبوع.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"reels\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">🎬<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Reel Scripts<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px)\">سكر
