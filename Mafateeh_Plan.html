ر ولا الخريجين — عشان العرضين التانيين يفضلوا واضحين وميتلخبطوش مع خصم الجماعة. الأرقام اللي فيها كسور (زي 262.5) اتقرّبت لأقرب جنيه<\u002Fspan><\u002Fdiv>\n\n  <h3 style=\"margin-top:28px;font-size:20px\">🧮 حاسبة عرض الأصحاب/الأسرة<\u002Fh3>\n  <div style=\"background:#fff;border:1px solid #DBD4BF;border-radius:18px;padding:28px;box-shadow:0 2px 18px rgba(35,46,40,.07);margin-top:12px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:22px\">\n      <div><label style=\"display:block;font-size:14px;color:#4B564E;margin-bottom:6px\">🌍 السوق<\u002Flabel>\n        <sc-raw-select value=\"{{ pcCountry }}\" sc-camel-on-change=\"{{ setPcCountry }}\" style=\"width:100%;padding:11px 14px;border-radius:10px;border:1px solid #DBD4BF;font-size:16px;background:#F5F2E8\">\n          <option value=\"350\">من داخل مصر (350 ج.م)<\u002Foption>\n          <option value=\"20\">من خارج مصر ($20)<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#4B564E;margin-bottom:6px\">🎫 نوع العرض<\u002Flabel>\n        <sc-raw-select value=\"{{ pcType }}\" sc-camel-on-change=\"{{ setPcType }}\" style=\"width:100%;padding:11px 14px;border-radius:10px;border:1px solid #DBD4BF;font-size:16px;background:#F5F2E8\">\n          <option value=\"friends\">أصحاب<\u002Foption>\n          <option value=\"family\">أسرة<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div><label style=\"display:block;font-size:14px;color:#4B564E;margin-bottom:6px\">👥 عدد الأفراد<\u002Flabel>\n        <sc-raw-select value=\"{{ pcCount }}\" sc-camel-on-change=\"{{ setPcCount }}\" style=\"width:100%;padding:11px 14px;border-radius:10px;border:1px solid #DBD4BF;font-size:16px;background:#F5F2E8\">\n          <option value=\"2\">فردان<\u002Foption>\n          <option value=\"3\">3 أفراد<\u002Foption>\n          <option value=\"4\">4 أفراد<\u002Foption>\n          <option value=\"5\">5 أفراد<\u002Foption>\n          <option value=\"6\">6 أفراد<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px\">\n      <div style=\"background:#28402F;color:#F5F2E8;border-radius:12px;padding:18px;text-align:center\"><b style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:24px;color:#DEC38C;display:block\">{{ pcTotal }}<\u002Fb><span style=\"font-size:13px;opacity:.88\">💰 الإجمالي<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#28402F;color:#F5F2E8;border-radius:12px;padding:18px;text-align:center\"><b style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:24px;color:#DEC38C;display:block\">{{ pcAvg }}<\u002Fb><span style=\"font-size:13px;opacity:.88\">🙋 متوسط الفرد<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:14.5px;color:#A85D4C;background:#F7EAE6;border:1px solid #EBD1CA;padding:14px 18px;border-radius:12px;margin-top:18px\">⚠️ عرض الحجز المبكر لازم يُغلق في موعده الفعلي بلا تمديد بلا سبب حقيقي، وعرض الخريجين يحتاج تحقق فعلي (كود دفعة سابقة أو رقم تسجيل) عشان ميتحولش لثغرة خصم عامة.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"escalation\" data-reveal=\"off\" style=\"max-width:1180px;margin:0 auto;padding:56px 24px;border-top:1px solid #DBD4BF\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><span style=\"color:#B4863C;font-size:22px\">🚨<\u002Fspan><span style=\"font-size:13.5px;letter-spacing:.6px;color:#4B564E;text-transform:uppercase\">Escalation Matrix<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:clamp(26px,3.2vw,36px)\">مصفوفة التصعيد — مين يتصرف وإمتى ⏱️<\u002Fh2>\n  <div style=\"margin:20px 0;background:linear-gradient(135deg,#3B5943 0%,#28402F 100%);color:#F5F2E8;border-radius:16px;padding:22px 26px;font-size:16px\">⚡ القاعدة الذهبية: أي مشكلة بتتأخر 30 دقيقة بلا حل = تتبلغ للميسّر (أبو عبود) فورًا.<\u002Fdiv>\n  <div style=\"overflow-x:auto\"><sc-raw-table>\n    <sc-raw-tr><sc-raw-th>المشكلة<\u002Fsc-raw-th><sc-raw-th>من يتصرف<\u002Fsc-raw-th><sc-raw-th>الإجراء الفوري<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>🔗 رابط التسجيل واقف أو غلط<\u002Fsc-raw-td><sc-raw-td>مسؤول الإعلانات<\u002Fsc-raw-td><sc-raw-td>يتصل بالتقني فورًا + يبلغ الميسّر<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>📨 رسائل بلا رد لأكتر من 30 دقيقة<\u002Fsc-raw-td><sc-raw-td>مسؤول خدمة العملاء<\u002Fsc-raw-td><sc-raw-td>يرد فورًا ويبلغ الميسّر<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>😰 مسجلين = صفر بعد 24 ساعة من فتح الباب<\u002Fsc-raw-td><sc-raw-td>الميسّر<\u002Fsc-raw-td><sc-raw-td>لايف مفاجئ + رسالة طوارئ للقائمة<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>📉 CPL أعلى من الهدف المشتق من CAC بـ30%+ لمدة يومين<\u002Fsc-raw-td><sc-raw-td>مسؤول الإعلانات<\u002Fsc-raw-td><sc-raw-td>إيقاف الإعلان واختبار Hook/جمهور جديد، لا زيادة الميزانية<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>⚖️ محتوى فيه تنميط أو تعميم بين الولد والبنت<\u002Fsc-raw-td><sc-raw-td>المراجع الشرعي<\u002Fsc-raw-td><sc-raw-td>وقف النشر فورًا وإعادة الصياغة<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-table><\u002Fdiv>\n<\u002Fsection>\n\n\n<footer style=\"padding:44px 24px;text-align:center;color:#4B564E;font-size:14px;border-top:1px solid #DBD4BF\">\n  🔑 مفاتيح تربية الأبناء — الخطة التسويقية الشاملة · أبجديات أونلاين 🌿\n<\u002Ffooter>\n\n<button sc-camel-on-click=\"{{ toTop }}\" style=\"position:fixed;bottom:24px;left:24px;z-index:60;width:50px;height:50px;border-radius:50%;border:none;background:#3B5943;color:#F5F2E8;font-size:20px;cursor:pointer;box-shadow:0 8px 24px rgba(40,64,47,.3);transition:transform .3s,background .3s\" style-hover=\"transform:translateY(-4px) scale(1.08);background:#B4863C\">⬆️<\u002Fbutton>\n\n<sc-if value=\"{{ toast }}\">\n  <div style=\"position:fixed;bottom:26px;right:26px;z-index:70;background:#28402F;color:#F5F2E8;padding:12px 20px;border-radius:30px;font-size:15px;box-shadow:0 10px 30px rgba(40,64,47,.32);animation:popIn .3s ease both\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;fontScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:17,&quot;min&quot;:15,&quot;max&quot;:21,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;القراءة&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;القراءة&quot;},&quot;startExpanded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;السلوك&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab:'fb', ptab:'eg', lecFilter:'all', search:'',\n    openLec:{}, openReel:{0:true},\n    calc:{target:500,price:350,cpl:12,conv:8,organic:20,safety:10},\n    pc:{country:'350',type:'friends',count:'2'},\n    ready:{}, toast:''\n  };\n  constructor(p){ super(p); this.barRef = React.createRef(); this.navRef = React.createRef(); }\n\n  bank = [\n{num:'2', emoji:'🤲', title:'تربية الولد أمانة', pillar:'1', phase:'indirect', phaseLabel:'غير مباشر — تمهيد',\n bigIdea:'الأب مش مجرد موفّر للنفقة؛ هو مهندس العقل وحارس الفطرة وغارس القيم. الولد استئمان إلهي، والوالد مسؤول عن دين الولد وعقله وخُلقه وتعليمه ونفقته ورعايته. الأثر المتعدي: الولد الصالح أعظم صدقة جارية.',\n hooks:['ابنك مش بس ابنك... هو أمانة هتتسأل عنها','أنت الشيطان في البيت (ازدواجية الأب/الأم في التدين قدام الطفل)','بابا صح؟ (تقليد الأبناء لأفعال آبائهم حرفيًا)','مالكش دعوة — أخطر نظرية دمّرت جيل كامل من الرجال','بعد الموت لسه بتتحاسب (سيئات الابن العاصي جارية على أبيه)'],\n quotes:[\n   {t:'ما نحل والد ولده من نحل أفضل من أدب حسن',s:'حديث نبوي'},\n   {t:'إذا مات ابن آدم انقطع عمله إلا من ثلاث: صدقة جارية، وعلم ينتفع به، وولد صالح يدعو له',s:'حديث نبوي — صحيح'},\n   {t:'قلبه جوهرة ساذجة، قابلة لكل نقش',s:'الإمام الغزالي'},\n   {t:'شيل كلمة تربية وحط تعويد',s:'من كلام الشيخ'},\n   {t:'أنا ربّيته على المعاصي دي عادي... بتتكتب عليه وبتتكتب عليّ',s:'من كلام الشيخ'}\n ],\n stories:['تقبيل النبي ﷺ للحسن ودهشة الأقرع بن حابس اللي قال «ما قبّلت أحدًا منهم قط»، فرد النبي ﷺ: «من لا يرحم لا يُرحم» — رواه أحمد بإسناد صحيح','عمر بن أبي سلمة وتعويد آداب الطعام: يده كانت تطيش في الصحفة، فقال له النبي ﷺ: «يا غلام، سمِّ الله، وكل بيمينك، وكل مما يليك» — متفق عليه'],\n situations:[],\n readyCopy:[\n   {hook:'وهو بيردّ عليكِ: باباما بيصليش', text:'\"بابا ما بيصليش\" ـ جملة بسيطة زي دي، قد إيه المرة اللي قالها فيها ابنك أو بنتك ردًا على \"ياهلل صلّي\"؟ الطفل الصغير مش بيسمع الأوامر بس، هو بيراقب. بيشوف مرتين: اللي بيقوم يصلي، والللي بيقول الكلام وبس. مش عيب منه، هو بس بيقولك اللي فعلًا شافه.'},\n   {hook:'بابا صح؟', text:'إحنا مش واخدين بالنا إن هما بيصوّرونا طول الوقت. الطفل مش بيسمع كلامك بس... هو بيتفرج عليك وهو بيقلدك.'},\n   {hook:'مالكش دعوة', text:'\"مالكش دعوة\" — فاكرة كام مرة قلتيها؟ مش قصدك حاجة وحشة، هي بس أسهل جملة بنقولها لما مش عايزين نشرح أو نتناقش. بس الجملة دي بتعلّم حاجة تانية غير اللي إحنا قاصدينها: إنه مفيش داعي يفكر، مفيش داعي يوقف نفسه، بس يمشي في طريقه من غير ما يسأل ليه. المشكلة إن الطفل هيكبر، وهيقابل مواقف محتاجة عقل بيوقف، بيسأل، بيوازن — قبل ما يتصرف. لكنه اتعوّد من الأول إن التفكير ده مش شغلته. مش لازم نشرح كل حاجة لولادنا بتفصيل ممل، بس ممكن بدل \"مالكش دعوة\" نقول \"ليه\"، ولو مرة واحدة بس في اليوم. الفرق بسيط، لكنه يبني عقل مختلف تمامًا.'}\n ],\n content:['ريلز قصير: يبدأ بجملة «اعلم أن الصبي أمانة عند والديه» مع تعليق نصي «هل أنت مستعد للسؤال؟» (من الدقيقة 1:21)','ريلز مصوّر بدون تعليق صوتي: أب على الكنبة بالموبايل، الابن يقلده بورقة ملفوفة زي السيجارة ويسأل «أنا بابا صح؟» — تعليق نصي بيظهر ببطء: «هو مش بيسمع كلامك بس... هو بيتفرج عليك وهو بيقلدك»','بوست تصميم بسيط: «صدقة جارية... أم سيئة جارية؟»']},\n\n{num:'3', emoji:'🌱', title:'مقدمة هامة في تربية الأبناء', pillar:'1', phase:'indirect', phaseLabel:'غير مباشر — تمهيد',\n bigIdea:'الطفل يتربى من سلوك والديه اليومي، مش من جلسات النصح بس. التربية حياة مش حصة. الصون والتأديب والتهذيب وتعليم محاسن الأخلاق هي شغلة الوالد المستمرة، مش موعد مجدول.',\n hooks:['ابنك بيتربى منك... حتى وإنت مش بتربيه','هو ابنك... ولا مشروعك الشخصي؟','الدلع اللي بتفتخر بيه... ممكن يكون نقطة ضعف','مشكلة مع ابنك محتاجة حوار مش أمر','ابنك مش بيسمعك بس... ابنك بيراقبك'],\n quotes:[\n   {t:'اعلم أن الصبي أمانة عند والديه، وقلبه جوهرة ساذجة، وهي قابلة لكل نقش',s:'ابن قدامة'},\n   {t:'فينبغي أن يصونه ويؤدبه ويهذبه ويعلمه محاسن الأخلاق',s:'ابن قدامة'},\n   {t:'أنت لما بتعمل أي حاجة حلوة أو وحشة دي تربية',s:'من كلام الشيخ'},\n   {t:'شغلتك إنك تصونه، شغلتك إنك تؤدبه، شغلتك إنك تهذبه، شغلتك إنك تعلّمه محاسن الأخلاق',s:'من كلام الشيخ'},\n   {t:'الزم إن أنا أصون ابني من نفسه',s:'من كلام الشيخ'},\n   {t:'مفيش حاجة اسمها أنا هعملهم حصة تربية',s:'من كلام الشيخ'},\n   {t:'القدوات المرئية',s:'من كلام الشيخ'},\n   {t:'المشاركة التفاعلية دي أحسنها',s:'من كلام الشيخ'}\n ],\n stories:['أنس بن مالك وعمر بن أبي سلمة: التعليم أثناء الموقف اليومي نفسه، مع التوجيه والتكرار والصبر','ابن عباس رضي الله عنهما: استغلال وجود الطفل لغرس معاني العقيدة والتوكل ومراقبة الله مبكرًا','أسامة بن زيد رضي الله عنه: إسناد المسؤولية للشاب — الصيانة لا تعني صناعة شخصية عاجزة','الشاب الذي جاء يستأذن النبي ﷺ في الزنا: الحوار الهادئ اللي ساعده يفهم بدل الاكتفاء بالتصادم','الاعتذار والقدوة: تعليم الطفل أن الاعتذار ليس ضعفًا، وأن رؤية الوالد يصحح خطأه تربية عملية'],\n situations:[],\n readyCopy:[],\n content:['مشهد أب يطلب من ابنه ألا يرفع صوته، ثم يراه الطفل يتعامل بعصبية لحظة بعدها','الفرق بين مساعدة الابن على اكتشاف نفسه وفرض طموحات الوالد عليه','طفل لا يعرف القيام بمسؤوليات بسيطة لأن أهله يفعلون كل شيء بدلًا منه','الحوار كوسيلة تربوية لما الطفل يحتاج فهمًا لا توبيخًا فقط']},\n\n{num:'7', emoji:'👕', title:'لباس الأولاد والموضة', pillar:'2', phase:'indirect', phaseLabel:'غير مباشر — تمهيد',\n bigIdea:'اللباس مرآة للهوية، مش تفاصيل شكلية. التقييد بالحكمة والحب رحمة، والقسوة فيه بتخرب. الأصالة المنهجية توازن بين الشرع والعرف المقبول والنفسية التربوية الحديثة.',\n hooks:['لبس ابنك بيتكلم قبل ما يفتح بقّه','غضّيت بصري عن ولد... واكتشفت إنه ولد!','الموضة اللي بتربي والدنا من غيرنا','التقييد... رحمة','سأل عن الجواز... ونسي يسأل عن أهم سؤال (التربية)','إزاي تقول لابنك \"ده غلط\" من غير ما تكسره؟','لو مش قادر تغيّره... على الأقل متسكتش'],\n quotes:[\n   {t:'البسوا من ثيابكم البياض، فإنها من خير ثيابكم، وكفّنوا فيها موتاكم، فإن الله يجلو البصر، ويشرح الصدر',s:'حديث صحيح — رواه أبو داود، رقم 3878'},\n   {t:'لعن الله المتشبهين من الرجال بالنساء، والمتشبهات من النساء بالرجال',s:'حديث صحيح — المجموع للنووي'},\n   {t:'التقييد رحمة',s:'من كلام الشيخ'},\n   {t:'ما بدأ الإسلام غريبًا، وسيعود غريبًا كما بدأ',s:'حديث نبوي'},\n   {t:'ابنك مش هيقبل منك إلا لو إحنا أصحاب',s:'من كلام الشيخ'},\n   {t:'لبس ابنك بيمثله، بيقدسه بمقدار ما يحسّ إنه جزء من التمثيل لاتجاهاته',s:'من كلام الشيخ'},\n   {t:'ارحم ابنك وارحم بنتك بأن تحط له قيود من وهو صغير',s:'من كلام الشيخ'}\n ],\n stories:[],\n situations:[],\n readyCopy:[\n   {hook:'لبس ابنك بيتكلم قبل ما يفتح بقّه', text:'هل فكرت قبل كده إن لبس ولدك ليه معنى؟ (رِيلز عن الحديث الشريف في اللباس الأبيض)'},\n   {hook:'الموضة اللي بتربي والدنا من غيرنا', text:'ابنك بيحب حاجة، بيقلد حاجة، بيتقمص حاجة... هل فكرتِ هو شايفها فين؟ مش دايمًا من بيته. أحيانًا من فيديو شافه ثانية، من صفحة مش عارفة اسمها. ولو كل اللي حواليه مستورد، مش مستغرب يبقى هو نفسه مستهلك مش ابن بيئته. مش المطلوب إنك تمنعيه كل حاجة، ولا تعزليه عن الدنيا. المطلوب إنك تسأليها السؤال ده بصراحة: مين اللي هو شايفها أكتر؟ مين اللي هو بيتربّى عليه... هو اللي هيتقلّده.'},\n   {hook:'سأل عن الجواز... ونسي يسأل عن أهم سؤال', text:'سأل عن المهر... ونسي يسأل عن أهم سؤال. قبل الجواز، بيتسأل عن كل حاجة: شغله، بيته، أهله، شكل حياته المادية. وبينسى سؤال واحد بسيط: اتربينا إزاي؟ لأن الاتنين مش بس بيتجوزوا بعض... هما هيربّوا ولاد مع بعض. ولو خلفيتهم التربوية مختلفة تمامًا، من غير ما يتكلموا فيها بصراحة من الأول، هتلاقيها بتطلع بعد كده، في كل قرار صغير عن الولاد. مش لازم يكونوا متطابقين في كل حاجة، بس لازم يكون فيه حوار حقيقي قبل ما يبقى فيه ولاد بينهم. اسأل عن التربية... زي ما بتسأل عن كل حاجة تانية.'},\n   {hook:'إزاي تقول لابنك ده غلط من غير ما تكسره؟', text:'إزاي تقول لابنك \"ده غلط\" من غير ما تكسره؟ فرق كبير بين إنك تصحّح لابنك، وإنك تهينه وانت بتصحح له. \"إنت غلطان\"، \"مش زي دي مش صح\"، \"عيب عليك\"، \"مش زي دي من أخلاقنا\" — الكلمة اللي بتستخدمها مش بس بتوصل معلومة، بتوصل معاها إحساس. وابنك بيفتكر الإحساس أكتر من الكلام. بيفتكر إنك مش راضي، من غير ما تكسر حاجة جواه. التربية مش سكوت على الغلط... ولا تجريح فيه، هي وسط بينهم.'},\n   {hook:'لو مش قادر تغيّره على الأقل متسكتش', text:'لو مش قادر تغيّره... على الأقل متسكتش. فيه لحظات هتحس إنك عاجز، إن الكلام مش بيوصل، إن التغيير مش في إيدك دلوقتي. بس فيه حاجة واحدة لسه في إيدك: إنك متبقاش راضي بصمتك. مش لازم تشتم، مش لازم تعاقب، مش لازم تهين، مش لازم تعلّق ع المشكلة. بس لازم يعرف إنك شايف، وإنك مش موافق عليه. لأن السكوت من غير ما تعلّق، بيتفهم على إنه رضا، حتى لو مقصودش كده. اقف على الباب في وشه بجملة بسيطة، ولو مقدرتيش تغيّري، على الأقل خلّي موقفك واضح.'}\n ],\n content:['ريلز قصير عن الحديث النبوي في اللباس الأبيض، مع نص تدريجي','ريلز هادئ متأملة: موقف الشيخ الشخصي مع الشخص اللي ظنّه بنتًا فاكتشف إنه ولد، غضّ بصره ظنًا منه أنها بنت','كاروسيل يشرح علامات \"الاختراق الثقافي\" في اختيارات الولد وخطوات عملية للحماية منه','كاروسيل أو ستوري: قصة الشاب اللي اتجوز من غير ما ياخد باله من فارق الخلفية التربوية بينه وبين زوجته','كاروسيل نقاط عملية مرقمة: أسلوب تصحيح الخطأ من غير ألفاظ مهينة أو مؤنثة','بوست قصير مباشر: إظهار عدم الرضا كواجب، حتى لو التغيير مش في إيدك بالكامل']},\n\n{num:'8', emoji:'⏳', title:'فيمَ أشغل ابني؟', pillar:'4', phase:'indirect', phaseLabel:'غير مباشر — تمهيد',\n bigIdea:'الفراغ بيتحول لخطر لما ميتشغلش بالقرآن والقدوات الحقيقية. الصحبة والمدخلات (أغاني، أشعار عاطفية، مجتمعات أعلى ماديًا) بتشكل هوية الطفل قبل ما يحس. التنعم يضعف العزم.',\n hooks:['ليه الأولاد بيسرقوا أهاليهم؟ (مجتمعات أو مدارس أعلى من مستواهم المادي)','باتمان وسبايدرمان أم خالد بن الوليد؟ (القدوة والهوية)','ابنك في ثالثة ثانوي وعارف سجود السهو؟ (الجهل بأساسيات الدين)','حماية الأبناء من العلاقات المبكرة (الأشعار العاطفية والأغاني)'],\n quotes:[\n   {t:'ليبدأ الرجل بتعليم ولده قبل أن يأتيه الشيطان فيسبق إليه',s:'سفيان الثوري'},\n   {t:'التنعم يضعف العزم، ومن ضعف عزمه قلّ شأنه واحتقر بين الناس',s:'من كلام الشيخ'},\n   {t:'فلو عشمتني بالتنعم وما نعمتنيش أشعر بالتعاسة والحزن وعدم الرضا... ولو حسّستني بالتنعم ونعّمتني أطلع قليل العزم حقير الشأن',s:'من كلام الشيخ'},\n   {t:'ثم يشغله في المكتب بتعليم القرآن والحديث وأحاديث الأخيار ليغرس في قلبه حب الصالحين',s:'من كلام الشيخ'},\n   {t:'من أعظم الظلم أن تسمح لابنك، بل تدفع ابنك اللي عنده تسع عشر سنين، أنه يدخل في علاقة عاطفية.. احمي ابنك وبنتك من كسرة القلب',s:'من كلام الشيخ'},\n   {t:'كسل البدن يؤدي إلى كسل القلب، يؤدي إلى كسل العقل والذهن، فيبقى في الآخر أنت مخلّف جثة',s:'من كلام الشيخ'},\n   {t:'التربية تأديب وإعطاء ومنع ومتابعة، رفع قيم.. أنت بتبني بني آدم ومحتاج إنك تركز أكتر عشان هتتحاسب على كل حاجة',s:'من كلام الشيخ'}\n ],\n stories:['سفيان الثوري وأمه: «يا بني اطلب العلم وأنا أعينك بمغزلي» — «ليبدأ الرجل بتعليم ولده قبل أن يأتيه الشيطان فيسبق إليه»','الإمام مالك وأمه: «اذهب إلى ربيعة فتعلم من أدبه قبل علمه»','الإمام الشافعي وأمه: كانت تحمله للكتّاب فحفظ القرآن وهو ابن سبع سنين','الإمام أحمد بن حنبل وأمه وأبيه: كانت توقظه قبل الفجر وتخرج به للمسجد؛ وقال لابنه عبد الله: «يلزم العلم فإنه رأس مالك»','الإمام الأوزاعي وأمه: «اطلب العلم فإني أرى الله قد ألهمك رشدك»','قصة ابن عباس مع النبي ﷺ: «يا غلام إني أعلّمك كلمات: احفظ الله يحفظك»','موقف النبي ﷺ مع عمر بن أبي سلمة وآداب الطعام','تبسّم النبي ﷺ في وجوه أصحابه: «تبسّمك في وجه أخيك لك صدقة»'],\n situations:['مخالطة الصبيان المتنعمين والترف: وضع الولد مع أصحاب مستواهم المادي أعلى منه بكثير — يدفعه لسرقة أهله لمجاراتهم (حيلة فلوس دروس الماث والفيزياء لشراء جزمة أو لعبة)','غياب الثقافة والتاريخ الإسلامي: معرفة الأطفال التفصيلية بالشخصيات الخيالية (سبايدرمان، هالك) مقابل جهلهم بالصحابة والفاتحين والدول المسلمة','رفض المظاهر الإسلامية: موقف البنت المنتقبة اللي استطلعت رأي الناس في الشارع، فتقبّلها غير المسلم بينما هاجمتها سيدة عربية مسلمة ورأت في سمتها تنفيرًا','تجاهل تعليم الأحكام الفقهية للشباب: طلاب ثالثة ثانوي لا يعرفون أحكامًا شرعية أساسية كسجود السهو أو الحجاب أو الميراث','سماع الأغاني العاطفية والأشعار الغرامية: تنمّي الشهوة والدخول في علاقات مبكرة تتسبب في كسرة القلب والتراجع الدراسي والديني','إغفال المهام الحياتية والرياضة والتكنولوجيا: عدم تعويد الطفل على حمل الأكياس، إغلاق الأبواب، إخراج القمامة، أو إغفال الرياضة والبرمجة، يخرج طفلًا كسولًا أو غير قادر على مواجهة الحياة'],\n readyCopy:[],\n content:['بوست استفزازي: مقارنة بين طفل منعم مدلل رافض للتوجيه، وطفل معتدل سهل الطاعة','سؤال استثارة للمعلمات والمربيات: إزاي تخلي الفصل أو الورشة بيئة تزرع \"التقوى\" بدل الترديد الروتيني — شاركينا رأيك','ريلز: خارطة طريق عملية لبناء الشخصية القيّمة للطفل','ريلز هوك: «أكبر خطأ بنقع فيه لما بنعلم أولادنا الصلاة أو القيم!» — التكليف المجرد بدون ربط القلب بالله','كاروسيل: بناء قيمة «الوعي الذاتي والرقابة» عند الأطفال — ربط التحدي اليومي بالخلق والتقدير والمتابعة غير المباشرة','ريلز: «المرء على دين خليله، فلينظر أحدكم من يخالل» — الطفل يلقط سلوكيات صحبته']},\n\n{num:'9', emoji:'🗝️', title:'تعزيز وتعديل السلوك للأبناء', pillar:'3', phase:'indirect', phaseLabel:'غير مباشر — تمهيد',\n bigIdea:'إحنا معانا مفاتيح — مفتاح التعزيز هو الثناء. لما يظهر من الطفل خلق جميل، يُكرَّم عليه ويُمدح بين الناس بما يفرح هو به، مش بما يفرح الأب به. ولو أخطأ، يُتغافل عنه أولًا، فإن عاد يُعاتب سرًا برفق وتخويف من اطلاع الناس، من غير إكثار من العتاب.',\n hooks:['إحنا معانا مفاتيح، لو ما استخدمتهاش هتقف قدام أبواب مغلقة','عايز تعمل تكرار لفعل؟ مفتاح التعزيز هو الثناء','الثناء كالملح في الطعام — رشة تظبط الطبخة، وكتير يبوظها','ابنك مرآة لتصرفاتك — المدح المتبادل','فخ المقارنة مقابل التعزيز الحقيقي','ليه الطفل مش بيسمع الكلام مهما زعقتيله؟'],\n quotes:[\n   {t:'ومتى ظهر من الصبي خلق جميل وفعل محمود، فينبغي أن يُكرم عليه، ويجازى بما يفرح به، ويمدح بين أظهر الناس؛ فإن خالف ذلك في بعض الأحوال تُغوفل عنه ولا يُكاشف؛ فإن عاد عُوتب سرًا وخُوّف من اطلاع الناس عليه',s:'ابن قدامة'},\n   {t:'من حسن التربية أن يفرح بفعله الحسن، ويُظهر الثناء عليه، ويُكرم أمام أقرانه',s:'الإمام الغزالي'},\n   {t:'يستحب حمد الصغير إذا أصاب ليقوى قلبه على الخير، كما يعاتب إذا أخطأ',s:'ابن مفلح'},\n   {t:'التحفيز بالثناء والمدح للصبيان مما يقربهم من الفضائل ويعوّدهم على طلب المعالي',s:'ابن خلدون'},\n   {t:'ينبغي للمعلم أن يثيب الصبي إذا أحسن ويظهر الرضا عنه، فإن ذلك أنشط له على طلب العلم',s:'ابن سحنون'},\n   {t:'إحنا معانا مفاتيح، المفاتيح دي لو أنت ما استخدمتهاش هتقف قدام أبواب مغلقة مستحيلة الفتح',s:'من كلام الشيخ'},\n   {t:'أكم من أفسده الثناء المبالغ فيه، وزرع في قلبه الكبر، فالثناء كالملح في الطعام',s:'من كلام الشيخ'}\n ],\n stories:['عمر بن الخطاب رضي الله عنه: كان يثني على الغلام إذا أحسن الإجابة في مجلسه ويقول «هكذا فكونوا»','ابن عمر رضي الله عنه: كان يعطي أولاد إخوانه التمر أو العطايا إذا حفظوا شيئًا من القرآن','الربيع بن سليمان مع الإمام الشافعي: «كنت إذا أجبت الشافعي جوابًا صوابًا، رأيت وجهه يتهلل، وربما دعاني إلى الطعام»','الإمام الشافعي: كان يقول للغلام المتأدب «هذا الغلام يُرجى أن يكون له شأن»','حديث سهل بن سعد: النبي ﷺ استأذن الغلام الجالس عن يمينه قبل إعطاء الشراب للكبار، فقال الغلام: «والله لا أوثر بنصيبي منك أحدًا» فأعطاه النبي ﷺ إياه','تعيين النبي ﷺ لأسامة بن زيد أميرًا على الجيش وهو في سن صغيرة، وسط كبار الصحابة، ودفاعه ﷺ عن أهليته لما طُعن في إمارته لصغر سنه','أم خالد بنت خالد: لبست قميصًا أصفر فقال لها النبي ﷺ «سَنَهْ سَنَهْ» (حسن/جميل بالحبشية) وأثنى على قميصها','رأى أنس بن مالك النبي ﷺ يحمل الحسن بن علي على عاتقه ويقول «اللهم إني أحبه فأحبه»، وفعل مثلها مع أسامة بن زيد: «إن هذين أحب الناس إليّ»','أنس بن مالك رضي الله عنه: خدم النبي ﷺ منذ صغره ولم يوبخه أبدًا على خطأ، بل كان يدعو له بالبركة في ماله وولده'],\n situations:['قواعد معالجة الخطأ: التغافل أولًا → فإن تكرر يُعاتب سرًا برفق وحب وصدق → فإن استمر يُفهم أن الغلام يحتاج عونًا وتوجيهًا لا عقابًا → قد يُذكَّر بمراقبة الله ثم التخويف من اطلاع الناس، مع عدم الإكثار من العتاب','الممنوع في المعالجة: العتاب المفرط، الإيذاء اللفظي، كثرة التخويف بالله في غير محله'],\n readyCopy:[],\n content:['كاروسيل استفزازي: صورة ملح على أكل (رشة ظبطت الطبخة) مقابل ملح على تورتة (بوظ طعمها) — سؤال: التعزيز زي الملح في الأكل؟','ريلز: تصميم مفاتيح مختلفة لكل باب — «حتى الجنة لها مفتاح، تفتكروا إيه المفتاح اللي يخلي ابنك يكرر الأسلوب الصح؟»','ريلز: فيديو طفل مبسوط، تظهر فقاعات بجمل عن أساليب التعزيز المختلفة (باب ضحكلي لما عملت ماما، خلتني أحاسب عمو...)','ستوري تفاعلي: «لو ابنك عمل حاجة غلط... تصارحه ولا تتغافل وتعالج السبب؟»','ستوري سؤال: «إزاي تعزز في ابنك تحمل المسؤولية؟»','ريلز: «ليه الطفل مش بيسمع الكلام مهما زعقتيلُه؟»','ريلز: «السر في التغافل»','كاروسيل «قواعد معالجة الخطأ»: العتاب – الإيذاء اللفظي السلبي – كثرة التخويف السلبي بالله في غير محله']},\n\n{num:'10', emoji:'🛡️', title:'3 أشياء لازم تحمي ابنك منهم', pillar:'2', phase:'indirect', phaseLabel:'غير مباشر — تمهيد',\n bigIdea:'أنت لا تربي ابنك فقط بما تقوله له، بل بما تعوّده عليه، وبما تسمح له أن يراه ويسمعه ويخالطه ويعتاده. ابنك محتاج مقاومة مش رفاهية مطلقة. أنت لا تختار أصحاب ابنك فقط، أنت تختار بيئته كلها.',\n hooks:['هل أنت بتسعد ابنك... ولا بتسلبه فرصة إنه يتعلم السعي؟','ما الذي يتعلمه ابنك من الطريق الذي يسلكه؟ (طفل يرى زميله متفوق في الرياضة أو حفظ القرآن)','أحيانًا منعك عن ابنك شيء تقدر تشتريه... هو عين التربية','مين صاحب ابنك؟ (المدرسة، المدرب، الناني، الأقارب، المحتوى)','ده لسه صغير! (أخطر فكرة — الطفل بيألف مش بس بيفهم)'],\n quotes:[\n   {t:'المرء على دين خليله، فلينظر أحدكم من يخالل',s:'حديث نبوي'},\n   {t:'ربّي ابنك عنده مقاومة',s:'من كلام الشيخ'},\n   {t:'لا تربِّ ابنك على الرفاهية فيُضيّع عمره في طلبها إذا كبر',s:'من كلام الشيخ'},\n   {t:'اللي ما بيعملش... ما بيتجابلوش',s:'من كلام الشيخ'},\n   {t:'أنت لا تربي ابنك فقط بما تعطيه له... بل بما تعوّده عليه',s:'من كلام الشيخ'},\n   {t:'جليس ابنك أو بنتك... لابد أن يكون صالحًا',s:'من كلام الشيخ'},\n   {t:'الطفل لا يحتاج فقط إلى من يعلّمه... بل إلى من يخالطه',s:'من كلام الشيخ'}\n ],\n stories:['أسامة بن زيد رضي الله عنه: النبي ﷺ أمّره على جيش وهو في سن صغيرة (نحو 18 عامًا) وفي الجيش كبار الصحابة، ودافع ﷺ عن أهليته لما طُعن في إمارته لصغر سنه — «هل ابنك ممكن يبقى قائد جيش؟»'],\n situations:['ابني مش ناقصه حاجة: الأب قادر ماديًا، وكل ما يطلبه الابن يُلبّى فورًا (موبايل، لعبة، خروجة) — هل بتسعد ابنك ولا بتسلبه فرصة إنه يتعلم السعي؟','طفل يرى زميله متفوق: واحد بيلعب رياضة، وواحد بيحفظ قرآن، الاتنين بيتعبوا وعندهم التزام — القضية مش نوع النشاط، القضية إنك تربي الطفل على البذل والاستمرار','أنا مش هجيبها له رغم إني أقدر: الأب يستطيع الشراء لكنه يتعمد التأجيل حتى يتعلم الابن أن الرغبة لا تعني الاستحقاق','أنا مطمن عليه عشان أصحابه كويسين: ثم نكتشف إن المشكلة مش في أصحابه بس، ممكن تكون في مدرسه أو مدربه أو الناني أو المحتوى اللي بيشاهده','ده لسه صغير: الطفل الصغير لا يفهم كل شيء، لكنه يألف كل شيء — المشكلة مش إنه \"يفهم\" الحرام، المشكلة إنه ممكن يتعوّد على رؤيته حتى يصبح غير مستنكر بالنسبة له'],\n readyCopy:[],\n content:['بوست: موقف الأب القادر ماديًا اللي بيجيب كل حاجة يطلبها ابنه من غير مجهود','بوست: طفلين، واحد بيلعب رياضة وواحد بيحفظ قرآن — الاتنين بيتعلموا البذل والاستمرار','بوست: الأب اللي يقدر يشتري بس بيتعمد يأجل — «أحيانًا منعك عن ابنك شيء تقدر تشتريه... هو عين التربية»','ريلز هوك: «مين صاحب ابنك؟» — سؤال إجابته مش اسم طفل واحد','محتوى قوي للأمهات عن فكرة إن الطفل بيألف قبل ما يفهم']},\n\n{num:'أهم ما تربي عليه ابنتك', emoji:'👧', title:'حاجات لازم تربي بنتك عليها', pillar:'4', phase:'indirect', phaseLabel:'غير مباشر — تمهيد (حساس، يحتاج مراجعة شرعية)',\n bigIdea:'الهيبة =/ الرعب، والتربية =/ الإهانة. الأب اللي بيهد شخصية ابنه بالتوبيخ والمقارنة والإهانة، بيتفاجأ بعدين إنه مش واثق في نفسه ومش طموح. تربية البنت لها خصوصية: أمة لله، زوجة، أم — تحتاج عفة وكرامة وجماليات وأنوثة ورقة، مش نسخة من تربية الولد.',\n hooks:['أنت بتهد في ابنك الحاجة اللي هتطلبها منه بكرة','هيبة أبويا: عايز ابنك يهابك؟ خد بالك إن الهيبة شيء، والرعب شيء آخر','بابا جاي! من إمتى بقى بابا هو العقوبة؟','اسمع الأول — الاستماع مش ضعف (قصة الكوباية المكسورة)','ما تعاقبش على عمى — افهم الموقف قبل ما تحكم','بص فالن! (فخ المقارنة يزرع \"أنا مش كويس\")','مكسور ولا متمرد؟ (نتيجتا erver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.setAttribute('data-reveal','on'); io.unobserve(e.target);} }),{threshold:.08,rootMargin:'0px 0px -40px 0px'});\n        io.observe(el);\n      });\n      setTimeout(()=>document.querySelectorAll('[data-reveal]:not([data-reveal=\"on\"])').forEach(el=>el.setAttribute('data-reveal','on')),4000);\n    };\n    setTimeout(rev,60);\n    document.querySelectorAll('[data-countup]').forEach(el=>{\n      const target = parseFloat(el.getAttribute('data-countup')); let s=null;\n      const step = t => { if(!s) s=t; const p=Math.min((t-s)/900,1); el.textContent = Math.round(target*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); };\n      el.textContent='0'; requestAnimationFrame(step);\n    });\n    this.onScroll = () => {\n      const h = document.documentElement;\n      const pct = h.scrollHeight>h.clientHeight ? (h.scrollTop/(h.scrollHeight-h.clientHeight))*100 : 0;\n      if(this.barRef.current) this.barRef.current.style.width = pct.toFixed(2)+'%';\n      const nav = this.navRef.current; if(!nav) return;\n      let cur='';\n      nav.querySelectorAll('a').forEach(a=>{\n        const el = document.getElementById(a.getAttribute('href').slice(1));\n        if(el && el.getBoundingClientRect().top <= 140) cur = a.getAttribute('href');\n      });\n      nav.querySelectorAll('a').forEach(a=>{\n        const on = a.getAttribute('href')===cur;\n        a.style.background = on ? '#3B5943' : 'transparent';\n        a.style.color = on ? '#F5F2E8' : '#4B564E';\n      });\n    };\n    window.addEventListener('scroll', this.onScroll, {passive:true});\n    this.onScroll();\n  }\n  componentWillUnmount(){ window.removeEventListener('scroll', this.onScroll); }\n\n  toast(msg){ this.setState({toast:msg}); clearTimeout(this._t); this._t=setTimeout(()=>this.setState({toast:''}),1800); }\n  copy(text){\n    try{ navigator.clipboard.writeText(text); }catch(e){}\n    this.toast('📋 اتنسخ! جاهز للصق');\n  }\n  toTop(){ window.scrollTo({top:0,behavior:'smooth'}); }\n\n  toggleLec(num){ this.setState(s=>({openLec:{...s.openLec,[num]:!s.openLec[num]}})); }\n  openAllLec(){ const o={}; this.bank.forEach(l=>o[l.num]=true); this.setState({openLec:o}); }\n  closeAllLec(){ this.setState({openLec:{}}); }\n\n  accentFor(p){ return {'1':'#3B5943','2':'#B4863C','3':'#A85D4C','4':'#7C8F55'}[p] || '#3B5943'; }\n\n  lectureList(){\n    const f = this.state.lecFilter, q = (this.state.search||'').trim();\n    return this.bank.filter(l=>{\n      if(f==='indirect' && l.phase!=='indirect') return false;\n      if(f==='direct' && l.phase!=='direct') return false;\n      if(['1','2','3','4'].indexOf(f)>-1 && l.pillar!==f) return false;\n      if(q && JSON.stringify(l).indexOf(q)===-1) return false;\n      return true;\n    }).map(l=>{\n      const open = !!this.state.openLec[l.num];\n      return {\n        num:l.num, emoji:l.emoji, title:l.title, bigIdea:l.bigIdea,\n        open, arrow: open ? '▲' : '▼',\n        headBg: open ? '#EFF3EA' : '#FFFFFF',\n        accent: this.accentFor(l.pillar),\n        phaseBg: l.phase==='direct' ? '#F3E0D6' : '#EFEADA',\n        phaseColor: l.phase==='direct' ? '#A85D4C' : '#28402F',\n        phaseText: l.phaseLabel + ' · محور ' + l.pillar,\n        onToggle: ()=>this.toggleLec(l.num),\n        hooks: (l.hooks||[]).map(h=>({text:h, onCopy:()=>this.copy(h)})),\n        quotes: l.quotes||[],\n        stories: (l.stories||[]).map(s=>({text:s})),\n        situations: (l.situations||[]).map(s=>({text:s})),\n        readyCopy: (l.readyCopy||[]).map(r=>({hook:r.hook, text:r.text, onCopy:()=>this.copy(r.hook+'\\n\\n'+r.text)})),\n        content: (l.content||[]).map(c=>({text:c})),\n        hasStories:(l.stories||[]).length>0,\n        hasSituations:(l.situations||[]).length>0,\n        hasReady:(l.readyCopy||[]).length>0,\n        hasContent:(l.content||[]).length>0\n      };\n    });\n  }\n\n  setCalc(k,v){ this.setState(s=>({calc:{...s.calc,[k]:v}})); }\n  setPc(k,v){ this.setState(s=>({pc:{...s.pc,[k]:v}})); }\n  toggleReady(n){ this.setState(s=>({ready:{...s.ready,[n]:!s.ready[n]}})); }\n  toggleReel(i){ this.setState(s=>({openReel:{...s.openReel,[i]:!s.openReel[i]}})); }\n  openAllReels(){ const o={}; this.reelData.forEach((r,i)=>o[i]=true); this.setState({openReel:o}); }\n  closeAllReels(){ this.setState({openReel:{}}); }\n\n  reelData = [\n  {title:'الحماية الثلاثية', meta:'من محتوى الدورة · 30-45 ث',\n   beats:[['0-3 ث','هوك','«3 حاجات لو ما حميتش ابنك منهم دلوقتي.. التربية هتبقى صعبة جدًا بعدين»'],['3-20 ث','المشكلة','لقطات سريعة لمواقف يومية بسيطة تكشف كل مهدد من الثلاثة بدون تهويل'],['20-35 ث','النصيحة الوقائية','نصيحة عملية خاطفة لكل مهدد — جملة واحدة فقط لكل نقطة'],['35-45 ث','CTA','«احفظه وابعته لأي أب أو أم» — بلا ذكر اسم الدورة في هذا الأسبوع']]},\n  {title:'أثر الترف والدلال الزايد', meta:'من محتوى الدورة · 30-45 ث',\n   beats:[['0-3 ث','هوك','«فاكر إنك بتسعده؟ إزاي الدلال الزايد بيضعف شخصية ابنك»'],['3-20 ث','التوضيح','الفرق بين الحب غير المشروط وتلبية كل رغبة مادية، بمثال يومي بسيط'],['20-35 ث','الأثر','أثر الترف على جلد الطفل النفسي عند مواجهة أول صعوبة حقيقية'],['35-45 ث','CTA','«شاركنا موقف حسيت فيه إنك دلعت أكتر من اللازم»']]},\n  {title:'استثمار وقت الفراغ', meta:'من محتوى الدورة · 30-45 ث',\n   beats:[['0-3 ث','هوك','«فيمَ أشغل ابني؟ بدائل عملية تنقذه من الشاشة والملل»'],['3-25 ث','3 أفكار','3 أنشطة عملية ومحببة تنمّي عقل الطفل بعيد عن الموبايل'],['25-45 ث','CTA','«شاركنا نشاط بيحبه ابنك بعيد عن الشاشة»']]},\n  {title:'أهم قيمة تُزرع في البنت', meta:'من محتوى الدورة · موجّه لأهل البنات تحديدًا · 30-45 ث',\n   beats:[['0-3 ث','هوك','«لو عندك بنت.. دي أهم قيمة لازم تزرعها فيها من الصغر»'],['3-25 ث','الشرح','خصوصية تربية البنات وأهم مرتكز بيحميها ويبني ثقتها المستقبلية'],['25-45 ث','CTA','«شاركينا رأيك في تعليق»']]},\n  {title:'العند وطاعة الوالدين', meta:'من محتوى الدورة · 30-45 ث',\n   beats:[['0-3 ث','هوك','«تعبت من العند؟ الطريقة اللي تخلي ابنك يسمعك بحب مش خوف»'],['3-25 ث','الخطوة العملية','خطوة واحدة عملية لبناء طاعة نابعة من احترام متبادل، لا من عقاب مستمر'],['25-45 ث','CTA','«اكتب كلمة مفاتيح لو حابب توصلك التفاصيل أول ما تنزل»']]},\n  {title:'ابنك أمانة قبل ما يكون مشروع', meta:'مقدمة الدورة · تمهيد · 30-40 ث',\n   beats:[['0-4 ث','هوك','«التربية ما بتبدأش بقاعدة؛ بتبدأ إننا نفهم إن ابننا أمانة»'],['4-25 ث','الفكرة','الفرق بين تشكيل الطفل بالقوة وفهمه ومرافقته في نموه'],['25-40 ث','CTA','«إيه أكتر موقف بيوجعك مع ولادك؟» — يفتح باب التعليقات']]},\n  {title:'آداب المجالس', meta:'محور الطاقات والمهارات · 30-40 ث',\n   beats:[['0-4 ث','هوك','«ابنك بيقاطع الكبار في الكلام؟ ده مش وقاحة.. ده مهارة ناقصة»'],['4-25 ث','التوضيح','الفرق بين تأديب قاسٍ وتعليم تدريجي لآداب الجلوس والاستماع'],['25-40 ث','CTA','«جرّب الخطوة دي الأسبوع ده وقولّنا حصل إيه»']]},\n  {title:'تشويقي — فتح باب التسجيل', meta:'بيعي / تشويقي · بداية شهر البيع · 40-55 ث',\n   beats:[['0-5 ث','هوك','«دورة مفاتيح تربية الأبناء.. قريبًا بتفتح أبوابها»'],['5-25 ث','القيمة','14 درسًا في 4 محاور: التأسيس، الحماية، السلوك والطباع، والمهارات — بمنهج نبوي وشرعي منظم'],['25-40 ث','الوعد','مش وصفة واحدة لكل الأبناء — مفاتيح تتعلمها وتطبقها حسب كل طفل وموقف'],['40-55 ث','CTA','«الرابط في البايو — كوني أول من يعرف موعد فتح التسجيل»']]}\n  ];\n\n  priceCombos = {\n    friends: {2:[1,0.75], 3:[1,0.75,0.75], 4:[1,1,0.75,0.5], 5:[1,1,0.75,0.75,0.5], 6:[1,1,1,0.75,0.5,0.5]},\n    family:  {2:[1,0.5], 3:[1,0.75,0], 4:[1,0.75,0.5,0], 5:[1,0.75,0.5,0.5,0], 6:[1,1,0.75,0.5,0,0]}\n  };\n\n  renderVals(){\n    const list = this.lectureList();\n    const c = this.state.calc;\n    const fmt = n => Math.round(n).toLocaleString('en-US');\n    const target = parseFloat(c.target) || 0;\n    const price = parseFloat(c.price) || 0;\n    const cpl = parseFloat(c.cpl) || 1;\n    const conv = (parseFloat(c.conv) || 1) / 100;\n    const organicPct = (parseFloat(c.organic) || 0) / 100;\n    const safety = 1 + (parseFloat(c.safety) || 0) / 100;\n    const totalStudentsNeeded = target * safety;\n    const totalLeadsNeeded = conv > 0 ? totalStudentsNeeded / conv : 0;\n    const organicLeads = totalLeadsNeeded * organicPct;\n    const paidLeads = totalLeadsNeeded - organicLeads;\n    const budget = paidLeads * cpl;\n    const revenue = target * price;\n    const readyDone = [1,2,3,4,5].filter(n=>this.state.ready[n]).length;\n    const pc = this.state.pc;\n    const base = parseFloat(pc.country);\n    const isEG = base >= 100;\n    const fmtP = n => isEG ? Math.round(n).toLocaleString('en-US') + ' ج.م' : '$' + (Math.round(n*100)/100);\n    const ratios = this.priceCombos[pc.type][parseInt(pc.count)];\n    let pcTotal = '—', pcAvg = '—';\n    if(ratios){\n      const tot = ratios.reduce((a,r)=>a+r*base,0);\n      pcTotal = fmtP(tot);\n      pcAvg = fmtP(tot/parseInt(pc.count));\n    }\n    return {\n      barRef:this.barRef, navRef:this.navRef,\n      toast:this.state.toast,\n      toTop:()=>this.toTop(),\n      search:this.state.search,\n      onSearch:(e)=>this.setState({search:e.target.value}),\n      openAllLec:()=>this.openAllLec(),\n      closeAllLec:()=>this.closeAllLec(),\n      lecCount: list.length + ' محاضرة معروضة',\n      lectures: list,\n      lecFilters: this.filterDefs.map(d=>({\n        label:d.label,\n        bg: this.state.lecFilter===d.f ? '#3B5943' : '#FFFFFF',\n        fg: this.state.lecFilter===d.f ? '#F5F2E8' : '#4B564E',\n        bd: this.state.lecFilter===d.f ? '#3B5943' : '#DBD4BF',\n        onPick: ()=>this.setState({lecFilter:d.f})\n      })),\n      masterHooks: this.masterHooks10.map((h,i)=>({n:String(i+1).padStart(2,'0'), text:h, onCopy:()=>this.copy(h)})),\n      isFb:this.state.tab==='fb', isIg:this.state.tab==='ig', isTt:this.state.tab==='tt',\n      isYt:this.state.tab==='yt', isTg:this.state.tab==='tg', isWa:this.state.tab==='wa',\n      reels: this.reelData.map((r,i)=>{\n        const open = !!this.state.openReel[i];\n        return {\n          n:String(i+1).padStart(2,'0'), title:r.title, meta:r.meta, open,\n          headBg: open ? '#3B5943' : '#F7F4EC',\n          numColor: open ? '#DEC38C' : '#B4863C',\n          titleColor: open ? '#F5F2E8' : '#28402F',\n          metaColor: open ? '#DEC38C' : '#4B564E',\n          beats: r.beats.map(b=>({time:b[0], label:b[1], text:b[2]})),\n          onToggle: ()=>this.toggleReel(i),\n          onCopy: (e)=>{ if(e && e.stopPropagation) e.stopPropagation(); this.copy(r.title+'\\n'+r.meta+'\\n\\n'+r.beats.map(b=>b[0]+' — '+b[1]+': '+b[2]).join('\\n')); }\n        };\n      }),\n      openAllReels:()=>this.openAllReels(),\n      closeAllReels:()=>this.closeAllReels(),\n      isEg:this.state.ptab==='eg', isIntl:this.state.ptab==='intl',\n      priceTabs:[{k:'eg',label:'🇪🇬 من داخل مصر'},{k:'intl',label:'🌍 من خارج مصر'}].map(t=>({\n        label:t.label,\n        bg: this.state.ptab===t.k ? '#3B5943' : '#FFFFFF',\n        fg: this.state.ptab===t.k ? '#F5F2E8' : '#4B564E',\n        bd: this.state.ptab===t.k ? '#3B5943' : '#DBD4BF',\n        onPick: ()=>this.setState({ptab:t.k})\n      })),\n      pcCountry:pc.country, pcType:pc.type, pcCount:pc.count,\n      setPcCountry:e=>this.setPc('country',e.target.value),\n      setPcType:e=>this.setPc('type',e.target.value),\n      setPcCount:e=>this.setPc('count',e.target.value),\n      pcTotal, pcAvg,\n      r1:!!this.state.ready[1], r2:!!this.state.ready[2], r3:!!this.state.ready[3], r4:!!this.state.ready[4], r5:!!this.state.ready[5],\n      setR1:()=>this.toggleReady(1), setR2:()=>this.toggleReady(2), setR3:()=>this.toggleReady(3),\n      setR4:()=>this.toggleReady(4), setR5:()=>this.toggleReady(5),\n      readyPct: (readyDone/5*100) + '%',\n      readyLabel: readyDone + ' من 5 بنود جاهزة',\n      readyEmoji: readyDone===5 ? '🟢' : (readyDone>=3 ? '🟡' : '🔴'),\n      cTarget:c.target, cPrice:c.price, cCpl:c.cpl, cConv:c.conv, cOrganic:c.organic, cSafety:c.safety,\n      setTarget:e=>this.setCalc('target',e.target.value),\n      setPrice:e=>this.setCalc('price',e.target.value),\n      setCpl:e=>this.setCalc('cpl',e.target.value),\n      setConv:e=>this.setCalc('conv',e.target.value),\n      setOrganic:e=>this.setCalc('organic',e.target.value),\n      setSafety:e=>this.setCalc('safety',e.target.value),\n      rLeads:fmt(totalLeadsNeeded), rPaidLeads:fmt(paidLeads), rBudget:fmt(budget),\n      rRevenue:fmt(revenue), rCAC:fmt(target>0 ? budget/target : 0),\n      rROAS: budget>0 ? (revenue/budget).toFixed(1)+'x' : '–',\n      platTabs: [{k:'fb',label:'📘 فيسبوك'},{k:'ig',label:'📸 انستجرام'},{k:'tt',label:'🎵 تيك توك'},{k:'yt',label:'▶️ يوتيوب'},{k:'tg',label:'✈️ تليجرام'},{k:'wa',label:'💬 واتساب'}].map(t=>({\n        label:t.label,\n        bg: this.state.tab===t.k ? '#3B5943' : '#FFFFFF',\n        fg: this.state.tab===t.k ? '#F5F2E8' : '#4B564E',\n        bd: this.state.tab===t.k ? '#3B5943' : '#DBD4BF',\n        onPick: ()=>this.setState({tab:t.k})\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
